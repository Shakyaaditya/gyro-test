<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Tilt Direction Tester</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:18px;color:#222}
.card{max-width:650px;margin:auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 15px #0002}
h2{margin-top:0}
button{padding:12px 16px;border:0;border-radius:9px;background:#222;color:#fff;font-size:16px;margin:5px;cursor:pointer}
button:disabled{opacity:.5}
.status{background:#eee;padding:10px;border-radius:8px;margin:10px 0;white-space:pre-wrap;font-size:14px}
.row{display:flex;gap:10px;align-items:center;margin:12px 0}
input{width:90px;padding:8px;font-size:16px}
#pad{width:300px;height:300px;max-width:90vw;margin:20px auto;border:2px solid #555;border-radius:50%;position:relative;background:#fafafa}
#dot{width:28px;height:28px;border-radius:50%;background:#111;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
pre{background:#111;color:#0f0;padding:10px;border-radius:8px;overflow:auto}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<div class="card">
<h2>Phone Tilt Direction Tester</h2>

<div id="status" class="status">Press START SENSOR. This version does NOT perform an HTTPS check.</div>

<button id="start">START SENSOR</button>
<button id="center" disabled>SET CURRENT POSITION AS CENTER</button>

<div id="pad"><div id="dot"></div></div>

<div class="row">LEFT ↔ RIGHT scale <input id="sx" type="number" step="0.1" value="1"></div>
<div class="row">UP ↕ DOWN scale <input id="sy" type="number" step="0.1" value="1"></div>
<div class="row">Dead zone <input id="dead" type="number" step="0.5" value="2"></div>

<pre id="data">No sensor data yet.</pre>

<p class="small">
This tester uses DeviceOrientation (phone tilt), not the raw gyroscope.
It does not modify BGMI or Android sensor data.
</p>
</div>

<script>
const statusEl=document.getElementById('status');
const dataEl=document.getElementById('data');
const dot=document.getElementById('dot');
const startBtn=document.getElementById('start');
const centerBtn=document.getElementById('center');
const sxEl=document.getElementById('sx');
const syEl=document.getElementById('sy');
const deadEl=document.getElementById('dead');

let running=false, last=null, cx=0, cy=0, gotData=false;

function showEnvironment(){
  statusEl.textContent =
    "URL: "+location.href+
    "\\nProtocol: "+location.protocol+
    "\\nSecure context: "+window.isSecureContext+
    "\\nHost: "+location.host+
    "\\nDeviceOrientation API: "+("DeviceOrientationEvent" in window)+
    "\\nPermission API: "+(typeof DeviceOrientationEvent !== "undefined" &&
                            typeof DeviceOrientationEvent.requestPermission === "function");
}
showEnvironment();

function handleOrientation(e){
  gotData=true;
  if(e.gamma==null || e.beta==null){
    statusEl.textContent="Sensor event received, but beta/gamma are unavailable.";
    return;
  }
  last={gamma:e.gamma,beta:e.beta};
  centerBtn.disabled=false;
  update();
}

function update(){
  if(!last)return;
  let x=(last.gamma-cx)*parseFloat(sxEl.value||1);
  let y=(last.beta-cy)*parseFloat(syEl.value||1);
  const dz=parseFloat(deadEl.value||0);
  if(Math.abs(x)<dz)x=0;
  if(Math.abs(y)<dz)y=0;

  const max=45;
  const px=Math.max(-135,Math.min(135,x/max*135));
  const py=Math.max(-135,Math.min(135,y/max*135));
  dot.style.left=(150+px)+"px";
  dot.style.top=(150+py)+"px";

  dataEl.textContent=
    "RAW gamma (left/right): "+last.gamma.toFixed(2)+"°"+
    "\\nRAW beta (up/down):    "+last.beta.toFixed(2)+"°"+
    "\\nCENTER gamma:          "+cx.toFixed(2)+"°"+
    "\\nCENTER beta:           "+cy.toFixed(2)+"°"+
    "\\nCORRECTED X:           "+x.toFixed(2)+"°"+
    "\\nCORRECTED Y:           "+y.toFixed(2)+"°";
}

async function startSensor(){
  showEnvironment();
  statusEl.textContent="Starting sensor…";

  try{
    if(typeof DeviceOrientationEvent==="undefined"){
      statusEl.textContent="DeviceOrientationEvent is not available in this browser/device.";
      return;
    }

    // Some browsers expose requestPermission; others do not.
    if(typeof DeviceOrientationEvent.requestPermission==="function"){
      const permission=await DeviceOrientationEvent.requestPermission();
      if(permission!=="granted"){
        statusEl.textContent="Motion/orientation permission was not granted. Check the browser/site sensor permission.";
        return;
      }
    }

    window.addEventListener("deviceorientation",handleOrientation,true);
    running=true;
    startBtn.disabled=true;
    centerBtn.disabled=false;
    statusEl.textContent="Sensor listener started. Move/tilt the phone now…";

    setTimeout(()=>{
      if(!gotData){
        statusEl.textContent=
          "Listener started, but NO orientation events arrived.\\n"+
          "The page is being served from:\\n"+location.href+
          "\\n\\nSecure context: "+window.isSecureContext+
          "\\n\\nIf Secure context is true, check Chrome site permissions for Motion sensors.";
      }
    },3000);
  }catch(err){
    statusEl.textContent="Sensor start error: "+err.name+" — "+err.message;
  }
}

startBtn.addEventListener("click",startSensor);

centerBtn.addEventListener("click",()=>{
  if(!last)return;
  cx=last.gamma;
  cy=last.beta;
  update();
  statusEl.textContent="Current phone position saved as CENTER.";
});

sxEl.addEventListener("input",update);
syEl.addEventListener("input",update);
deadEl.addEventListener("input",update);
</script>
</body>
</html>
